{% extends "base.html" %}

{% block content %}
<h1>Квартирник</h1>

{% for event, t in cards %}
  <div class="event">
    <p class="when">{{ event.starts_at.strftime("%d.%m.%Y, %H:%M") }}</p>
    <h2><a href="/{{ lang }}/event/{{ event.slug }}">{{ t.title }}</a></h2>
  </div>
{% else %}
  <p>Подій поки немає.</p>
{% endfor %}
{% endblock %}
